<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella's Reading Space | 归朴阅读</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg: #Fdfdfb;          /* 极浅的宣纸白 */
      --card: #FFFFFF;
      --border: #F0ebe1;      /* 极浅的茶色边框 */
      --text: #2b2b2b;        /* 徽墨黑 */
      --text-light: #8c8c8c;  /* 烟墨灰 */
      --accent: #8b3a3a;      /* 暗朱砂红 */
      --radius-sm: 2px;
      --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.04);
      --font-sans: "PingFang SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "STSong", "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
      --transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* 真实的纸张纤维肌理 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Layout ===== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 100px 32px 80px;
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ===== Hero Section ===== */
    .hero {
      margin-bottom: 120px;
      animation: fadeUp 1s ease-out forwards;
      position: relative;
      padding-left: 4px;
    }

    .hero-eyebrow {
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--text-light);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 1px;
      background: var(--text-light);
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 32px;
      letter-spacing: 6px;
      line-height: 1.2;
    }

    .hero p {
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--text-light);
      max-width: 480px;
      letter-spacing: 1px;
      line-height: 2;
      padding-left: 36px;
    }

    /* ===== Section Tabs (Asymmetric Layout) ===== */
    .bookshelf {
      display: grid;
      grid-template-columns: 2.4fr 1fr;
      gap: 0;
      position: relative;
      border-top: 1px solid var(--border);
      padding-top: 60px;
    }

    /* 贯穿两本书的极细分割线，制造“一页笔记”的趣味 */
    .bookshelf::after {
      content: '';
      position: absolute;
      top: 60px;
      bottom: 0;
      left: 71.5%;  /* 落在 2.4/(2.4+1) ≈ 70.5% 附近，制造黄金分割错落 */
      width: 1px;
      background: var(--border);
    }

    .book-column {
      padding: 0 40px 0 0;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .book-column.right {
      padding: 0 0 0 40px;
    }

    /* 错落：第一本下沉 20px */
    .book-column.left {
      padding-top: 20px;
    }

    /* ===== Book Card ===== */
    .book-card {
      background: transparent;
      border: none;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 24px;
      transition: var(--transition);
      position: relative;
      animation: fadeUp 1s ease-out forwards;
      opacity: 0;
    }

    .book-column.left .book-card {
      animation-delay: 0.2s;
    }

    .book-column.right .book-card {
      animation-delay: 0.4s;
    }

    /* 墨水晕染效果：Hover 时缓缓洇开一抹暗朱砂 */
    .book-card::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .book-card:hover::after {
      width: 100%;
    }

    .book-card:hover .book-cover {
      transform: translateY(-4px);
      box-shadow: 16px 20px 40px rgba(0,0,0,0.06), -1px 0 2px rgba(0,0,0,0.02);
    }

    /* Book Cover - 模拟民国线装书 */
    .book-cover {
      width: 100%;
      aspect-ratio: 3/4;
      background: #f4f0e6;
      border: 1px solid #e6e2d8;
      border-radius: 2px 6px 6px 2px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 12px 12px 30px rgba(0,0,0,0.03), -1px 0 2px rgba(0,0,0,0.02);
      transition: var(--transition);
    }

    /* 书脊阴影 */
    .book-cover::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      background: linear-gradient(to right, rgba(255,255,255,0.4), rgba(0,0,0,0.05), transparent);
      z-index: 2;
    }

    .book-cover-title {
      font-family: var(--font-serif);
      color: var(--text);
      font-size: 24px;
      font-weight: 400;
      text-align: center;
      padding: 30px 20px;
      line-height: 1.5;
      writing-mode: vertical-rl;
      letter-spacing: 6px;
      z-index: 1;
    }

    .book-cover-en {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 8px;
      color: var(--text-light);
      writing-mode: horizontal-tb; /* 英文恢复横排 */
    }

    /* Book Info */
    .book-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .book-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-family: var(--font-sans);
      color: var(--text-light);
    }

    .book-tag {
      color: var(--accent);
      border: 1px solid rgba(139, 58, 58, 0.2);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .book-title {
      font-size: 18px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.5;
    }

    .book-desc {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ===== Section Heading (Tabs) ===== */
    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 32px;
      margin-bottom: 40px;
    }

    .section-heading h2 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 4px;
      cursor: pointer;
      transition: color 0.3s ease;
      position: relative;
    }

    .section-heading h2.inactive {
      color: var(--text-light);
    }

    .section-heading h2.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--accent);
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 60px 24px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: #b3b3b3;
      margin-top: auto;
      letter-spacing: 2px;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    /* ===== Animations ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .container { padding: 60px 24px 60px; }
      .hero h1 { font-size: 32px; letter-spacing: 4px; }
      .hero p { padding-left: 0; }
      .bookshelf {
        grid-template-columns: 1fr;
        gap: 60px;
      }
      .bookshelf::after { display: none; }
      .book-column, .book-column.right {
        padding: 0;
      }
      .book-column.left {
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="hero">
      <div class="hero-eyebrow">Bella's Reading Space</div>
      <h1>在克制中探寻广阔<br>于归朴处安放心智</h1>
      <p>这里是我的私人数字书架。<br>每本书都像一扇窗，通向一段被记录的思考。</p>
    </header>

    <!-- 主分类标题：读书笔记 / 英文学习 -->
    <div class="section-heading">
      <h2 id="tab-books" class="active" onclick="switchTab('books')">读书笔记</h2>
      <h2 id="tab-english" class="inactive" onclick="switchTab('english')">英文学习</h2>
    </div>

    <!-- 非对称 Bookshelf：左大右小 (2.4:1) -->
    <main class="bookshelf">
      <div class="book-column left tab-content active" id="content-books">
        <!-- Book 1: 主书，封面占据左侧大空间 -->
        <a href="./books/guns-germs-steel.html" class="book-card">
          <div class="book-cover" style="background-color: #2c1810;">
            <div class="book-cover-title" style="color: #d4a853;">枪炮、病菌<br>与钢铁</div>
          </div>
          <div class="book-info">
            <div class="book-meta">
              <span>贾雷德·戴蒙德</span>
              <span class="book-tag">探案笔记</span>
            </div>
            <h3 class="book-title">谁"偷"走了人类历史的公平？</h3>
            <p class="book-desc">为什么是欧洲人征服了美洲，而不是反过来？跟着我，像一个侦探一样，找到真相。</p>
          </div>
        </a>
      </div>

      <div class="book-column right tab-content" id="content-english">
        <!-- English Note 1: 副书，右侧小空间 -->
        <a href="./english/english-learning-guide.html" class="book-card">
          <div class="book-cover" style="background-color: #fdfdfb;">
            <div class="book-cover-title" style="color: #2b2b2b;">英语<br>学习方法</div>
          </div>
          <div class="book-info">
            <div class="book-meta">
              <span>学习笔记</span>
              <span class="book-tag" style="border-color: rgba(43,43,43,0.2); color: #2b2b2b;">方法论</span>
            </div>
            <h3 class="book-title">英语学习系统构建</h3>
            <p class="book-desc">摆脱传统死记硬背的误区，探讨如何高效习得语言。</p>
          </div>
        </a>
      </div>
    </main>
  </div>

  <footer>
    &copy; 2026 Bella Read. 保持思考，保持留白。
  </footer>

  <script>
    function switchTab(tabId) {
      // 切换标题状态
      document.querySelectorAll('.section-heading h2').forEach(h => {
        h.classList.remove('active');
        h.classList.add('inactive');
      });
      document.getElementById('tab-' + tabId).classList.remove('inactive');
      document.getElementById('tab-' + tabId).classList.add('active');

      // 切换内容区
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
        content.style.display = 'none';
      });
      const target = document.getElementById('content-' + tabId);
      target.classList.add('active');
      target.style.display = 'flex';
    }
  </script>
</body>
</html>
