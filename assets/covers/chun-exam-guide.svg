  <text x="128" y="556" font-size="34" font-family="'Microsoft YaHei', sans-serif" font-weight="700" fill="#5B463A">结构链</text>
  <text x="128" y="614" font-size="38" font-family="'Microsoft YaHei', sans-serif" font-weight="800" fill="#FF6F8E">盼 → 醒 → 草 → 花 → 风 → 雨 → 人 → 赞</text>
  <text x="128" y="658" font-size="26" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">背诵不散，答题不空，赏析有抓手</text>
