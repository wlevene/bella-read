  <text x="126" y="850" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 比喻、拟人、排比</text>
  <text x="126" y="890" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 多感官写景</text>
  <text x="126" y="930" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 由物到人、由景到情</text>
  <text x="450" y="794" font-size="30" font-family="'Microsoft YaHei', sans-serif" font-weight="800" fill="#5B463A">提分动作</text>
  <text x="450" y="850" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 先背结构再背句子</text>
  <text x="450" y="890" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 赏析先点手法再点效果</text>
  <text x="450" y="930" font-size="24" font-family="'Microsoft YaHei', sans-serif" font-weight="600" fill="#6E5A4F">• 结尾三喻单独记牢</text>
