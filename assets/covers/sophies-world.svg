<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2254"/>
      <stop offset="45%" stop-color="#4B3B82"/>
      <stop offset="75%" stop-color="#835CA3"/>
      <stop offset="100%" stop-color="#EAA698"/>
    </linearGradient>
    
    <!-- 纸张底色 -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF1EB" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 金色发光 -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4B8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFD152" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFA834" stop-opacity="0"/>
    </radialGradient>

    <!-- 阴影 -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#261A35" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 边框背景与夜空 -->
  <rect width="600" height="800" rx="36" fill="url(#skyGrad)"/>
  <rect x="16" y="16" width="568" height="768" rx="26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12 8" opacity="0.4"/>

  <!-- 星星与星芒 -->
  <g fill="#FFF5BA">
    <!-- 月亮 -->
    <circle cx="480" cy="130" r="54" fill="#FFE57F"/>
    <circle cx="505" cy="115" r="48" fill="#3D2F6B"/>
    <!-- 星星 -->
    <path d="M120 90 L125 105 L140 110 L125 115 L120 130 L115 115 L100 110 L115 105 Z" opacity="0.9"/>
    <path d="M220 60 L223 70 L233 73 L223 76 L220 86 L217 76 L207 73 L217 70 Z" opacity="0.8"/>
    <path d="M380 90 L383 100 L393 103 L383 106 L380 116 L377 106 L367 103 L377 100 Z" opacity="0.7"/>
    <circle cx="170" cy="160" r="4" opacity="0.6"/>
    <circle cx="280" cy="140" r="5" opacity="0.7"/>
    <circle cx="90" cy="220" r="3" opacity="0.5"/>
    <circle cx="520" cy="260" r="4" opacity="0.6"/>
  </g>

  <!-- 古希腊罗马柱（象征西方哲学源头） -->
  <g stroke="#352642" stroke-width="4" fill="#FDF7EE">
    <!-- 左侧罗马柱 -->
    <path d="M 60 490 L 60 720 L 110 720 L 110 490 Z"/>
    <path d="M 50 475 L 120 475 L 120 490 L 50 490 Z" rx="3"/>
    <path d="M 45 720 L 125 720 L 125 745 L 45 745 Z" rx="4"/>
    <line x1="77" y1="495" x2="77" y2="715" stroke="#352642" stroke-width="3" stroke-linecap="round"/>
    <line x1="93" y1="495" x2="93" y2="715" stroke="#352642" stroke-width="3" stroke-linecap="round"/>

    <!-- 右侧罗马柱 -->
    <path d="M 490 510 L 490 730 L 540 730 L 540 510 Z"/>
    <path d="M 480 495 L 550 495 L 550 510 L 480 510 Z" rx="3"/>
    <path d="M 475 730 L 555 730 L 555 755 L 475 755 Z" rx="4"/>
    <line x1="507" y1="515" x2="507" y2="725" stroke="#352642" stroke-width="3" stroke-linecap="round"/>
    <line x1="523" y1="515" x2="523" y2="725" stroke="#352642" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 柔和云层地面 -->
  <path d="M -20 730 Q 120 680 260 720 T 620 710 L 620 820 L -20 820 Z" fill="#FFEFEA" stroke="#352642" stroke-width="5"/>

  <!-- 主角苏菲（萌系 Q 版少女） -->
  <g id="sophie-character" filter="url(#stickerShadow)">
    <!-- 身体风衣 -->
    <path d="M 255 580 C 240 640 215 715 210 735 L 390 735 C 385 715 360 640 345 580 Z" fill="#E86A82" stroke="#352642" stroke-width="5"/>
    <!-- 围巾 -->
    <path d="M 265 565 Q 300 585 335 565 Q 350 610 325 615 Q 300 595 275 615 Z" fill="#FFD152" stroke="#352642" stroke-width="4.5"/>
    <path d="M 315 585 L 335 660 L 310 665 L 298 590 Z" fill="#FFD152" stroke="#352642" stroke-width="4"/>

    <!-- 头部与短发 -->
    <circle cx="300" cy="500" r="54" fill="#FFE8D6" stroke="#352642" stroke-width="5"/>
    <!-- 棕色波波头短发 -->
    <path d="M 240 500 C 235 440 265 430 300 430 C 335 430 365 440 360 500 C 365 530 355 550 345 540 C 340 500 330 460 300 460 C 270 460 260 500 255 540 C 245 550 235 530 240 500 Z" fill="#6A432D" stroke="#352642" stroke-width="5"/>

    <!-- 眼睛与微笑 -->
    <ellipse cx="282" cy="502" rx="4.5" ry="6" fill="#352642"/>
    <ellipse cx="318" cy="502" rx="4.5" ry="6" fill="#352642"/>
    <circle cx="284" cy="500" r="1.5" fill="#FFF"/>
    <circle cx="320" cy="500" r="1.5" fill="#FFF"/>
    <!-- 腮红 -->
    <ellipse cx="270" cy="515" rx="7" ry="4" fill="#FFAAA6" opacity="0.8"/>
    <ellipse cx="330" cy="515" rx="7" ry="4" fill="#FFAAA6" opacity="0.8"/>
    <!-- 微笑 -->
    <path d="M 294 515 Q 300 522 306 515" fill="none" stroke="#352642" stroke-width="3" stroke-linecap="round"/>

    <!-- 双手捧起发光的神秘信封 -->
    <g transform="translate(250, 545)">
      <!-- 发光光晕 -->
      <circle cx="50" cy="20" r="45" fill="url(#goldGlow)"/>
      <!-- 信封 -->
      <rect x="15" y="-5" width="70" height="48" rx="6" fill="#FFFDF2" stroke="#352642" stroke-width="4"/>
      <path d="M 15 -5 L 50 22 L 85 -5" fill="none" stroke="#352642" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 红色火漆印章 -->
      <circle cx="50" cy="18" r="8" fill="#D32F2F" stroke="#352642" stroke-width="2.5"/>
      <!-- 信上的问号 -->
      <text x="50" y="8" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" fill="#E65100" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- 聪明的小猫头鹰（站在罗马柱上） -->
  <g transform="translate(85, 430)" filter="url(#stickerShadow)">
    <ellipse cx="0" cy="0" rx="22" ry="26" fill="#8D6E63" stroke="#352642" stroke-width="4"/>
    <ellipse cx="0" cy="4" rx="15" ry="18" fill="#D7CCC8"/>
    <!-- 眼睛 -->
    <circle cx="-8" cy="-6" r="8" fill="#FFF" stroke="#352642" stroke-width="3"/>
    <circle cx="8" cy="-6" r="8" fill="#FFF" stroke="#352642" stroke-width="3"/>
    <circle cx="-7" cy="-6" r="4" fill="#352642"/>
    <circle cx="7" cy="-6" r="4" fill="#352642"/>
    <!-- 喙 -->
    <polygon points="0,-1 -3,-5 3,-5" fill="#FFA000" stroke="#352642" stroke-width="2"/>
    <!-- 博士帽 -->
    <polygon points="0,-32 -24,-24 0,-16 24,-24" fill="#352642"/>
    <line x1="16" y1="-22" x2="22" y2="-10" stroke="#FFD54F" stroke-width="2"/>
  </g>

  <!-- 顶部书名招牌（Q版卡通贴纸效果） -->
  <g transform="translate(300, 240)" filter="url(#stickerShadow)">
    <!-- 标题白色底卡 -->
    <rect x="-240" y="-120" width="480" height="150" rx="28" fill="#FFFFFF" stroke="#352642" stroke-width="6"/>
    <!-- 小徽章 -->
    <rect x="-110" y="-142" width="220" height="34" rx="17" fill="#FFD152" stroke="#352642" stroke-width="4"/>
    <text x="0" y="-120" font-family="'Smiley Sans', 'PingFang SC', sans-serif" font-size="16" font-weight="800" fill="#352642" text-anchor="middle" letter-spacing="2">
      西方哲学思维奇旅
    </text>

    <!-- 中文大书名 -->
    <text x="0" y="-45" font-family="'Smiley Sans', 'PingFang SC', sans-serif" font-size="52" font-weight="900" fill="#352642" text-anchor="middle" letter-spacing="4">
      苏菲的世界
    </text>

    <!-- 英文副标题与金句 -->
    <text x="0" y="-6" font-family="'Nunito', 'Quicksand', sans-serif" font-size="20" font-weight="800" fill="#6C5CE7" text-anchor="middle" letter-spacing="1.5">
      SOPHIE'S WORLD
    </text>
    <text x="0" y="18" font-family="'Smiley Sans', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#88728D" text-anchor="middle">
      “你是谁？世界从何而来？一封信开启的智慧冒险”
    </text>
  </g>
</svg>
